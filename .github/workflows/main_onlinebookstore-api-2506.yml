# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - onlinebookstore-api-2506

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'
      
      - name: Restore
        run: dotnet restore ./OnlineBookStore/OnlineBookStore.sln

      - name: Build .NET API
        run: dotnet build ./OnlineBookStore/OnlineBookStore/OnlineBookStore.API.csproj --configuration Release --no-restore

      - name: dotnet publish
        run: dotnet publish ./OnlineBookStore/OnlineBookStore/OnlineBookStore.API.csproj -c Release -o ./publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ./publish
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2542D7EB54CF4EEBA159ED9A444480D7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0F3AE8574DB44289B8D7AE7795E1C3A9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5995ACF7FE6A47C2B6495437F865DEBD }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'onlinebookstore-api-2506'
          slot-name: 'Production'
          package: .
          
