<div class="container mt-4">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h3 class="mb-0">Online Book Store</h3>
    </div>

    <div class="card-body">
      <div class="row">
        <!-- Left -->

        <div class="col-lg-8">
          <div class="card">
            <div class="card-header bg-dark text-white">
              <h5 class="mb-0">Book List</h5>
            </div>

            <div class="card-body table-responsive">
              <!-- <h4>Total Books : {{ this.bookList.length }}</h4>

              <pre>{{ bookList | json }}</pre> -->
              <table class="table table-bordered table-hover">
                <thead class="table-light text-center">
                  <tr>
                    <th>#</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>ISBN</th>
                    <th>Price</th>
                    <th width="150">Action</th>
                  </tr>
                </thead>

                <tbody>
                  @for (book of bookList; track $index) {
                    <tr>
                      <td>{{ $index + 1 }}</td>
                      <td>{{ book.title }}</td>
                      <td>{{ book.author }}</td>
                      <td>{{ book.isbn }}</td>
                      <td>{{ book.price }}</td>

                      <td>
                        <button class="btn btn-warning btn-sm me-2" (click)="editBook(book)">
                          Edit
                        </button>

                        <button class="btn btn-danger btn-sm" (click)="deleteBook(book.id)">
                          Delete
                        </button>
                      </td>
                    </tr>
                  }
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Right -->

        <div class="col-lg-4">
          <div class="card">
            <div class="card-header bg-success text-white">
              <h5 class="mb-0">
                {{ bookObj.id == 0 ? 'Add Book' : 'Update Book' }}
              </h5>
            </div>

            <div class="card-body">
              <div class="mb-3">
                <label>Title</label>

                <input class="form-control" [(ngModel)]="bookObj.title" />
              </div>

              <div class="mb-3">
                <label>Description</label>

                <textarea rows="3" class="form-control" [(ngModel)]="bookObj.description">
                </textarea>
              </div>

              <div class="mb-3">
                <label>Author</label>

                <input class="form-control" [(ngModel)]="bookObj.author" />
              </div>

              <div class="mb-3">
                <label>ISBN</label>

                <input class="form-control" [(ngModel)]="bookObj.isbn" />
              </div>

              <div class="mb-3">
                <label>Price</label>

                <input type="number" class="form-control" [(ngModel)]="bookObj.price" />
              </div>

              <div class="mb-3">
                <label>Category</label>
                <select class="form-control" [(ngModel)]="bookObj.categoryId">
                  <option value="0">-- Select Category --</option>

                  <!-- @for (category of categoryList; track $index) {
                    <option id="{{ category.id }}">{{ category.name }}</option>
                  } -->

                  @for (category of categoryList; track category.id) {
                    <option [value]="category.id">
                      {{ category.name }}
                    </option>
                  }
                </select>
                <!-- <input type="number" class="form-control" [(ngModel)]="bookObj.categoryId" /> -->
              </div>
              <div class="mb-3">
                <label class="form-label"> Book Image </label>

                <input
                  type="file"
                  #fileInput
                  class="form-control"
                  (change)="onFileSelected($event)"
                  [disabled]="bookObj.id == 0 ? false : true"
                />
              </div>

              <div class="d-grid gap-2">
                @if (bookObj.id == 0) {
                  <button class="btn btn-success" (click)="saveBook()">Add Book</button>
                } @else {
                  <button class="btn btn-primary" (click)="updateBook()">Update Book</button>
                }

                <button class="btn btn-secondary" (click)="resetForm()">Reset</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
