<div class="container-fluid vh-100">
  <div class="row h-100">
    <!-- Left Side -->
    <div
      class="col-lg-7 d-none d-lg-flex bg-primary text-white align-items-center justify-content-center"
    >
      <div class="text-center px-5">
        <img
          src="https://cdn-icons-png.flaticon.com/512/2702/2702134.png"
          class="img-fluid mb-4"
          style="max-width: 220px"
          alt="Book Store"
        />

        <h1 class="display-5 fw-bold">Welcome to Online Book Store</h1>

        <p class="lead mt-3">
          Discover thousands of books from your favorite authors. Read, explore and shop anytime,
          anywhere.
        </p>
      </div>
    </div>

    <!-- Right Side -->
    <div class="col-lg-5 d-flex align-items-center justify-content-center bg-light">
      <div class="card shadow-lg border-0 rounded-4 p-4 login-card">
        <div class="text-center mb-4">
          <i class="bi bi-book-half text-primary display-3"></i>

          <h2 class="fw-bold mt-2">Login</h2>

          <p class="text-muted">Sign in to continue</p>
        </div>

            <input

          </div>

        <form>
          <input
            class="form-control mb-3"
            placeholder="Email"
            [(ngModel)]="loginObj.email"
            name="email"
          />

          <input
            type="password"
            class="form-control mb-3"
            placeholder="Password"
            [(ngModel)]="loginObj.password"
            name="password"
          />

          <button class="btn btn-primary w-100" type="button" (click)="onLogin()">Login</button>
        </form>
        <hr />

        <div class="text-center">
          Don't have an account?

          <a href="#" class="fw-bold text-decoration-none"> Register </a>
        </div>
      </div>
    </div>
  </div>
